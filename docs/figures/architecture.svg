<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-labelledby="t d">
<title id="t">Muse MCP Adapter architecture</title>
<desc id="d">Muse calls the adapter over REST with one token per connector. The adapter checks every call against the policy you approved, uses your credentials itself, and talks to MCP servers such as GitHub and Linear. A call that is not on your list is refused.</desc>
<style>
  .bg{fill:#0d1117}
  .t{font:600 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
  .h{font:700 22px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
  .s{font:400 12.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9198a1}
  .l{font:500 12.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#c9d1d9}
  .m{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
  .box{fill:#151b23;stroke:#3d444d;stroke-width:1.5}
  .zone{fill:#10161f;stroke:#4493f8;stroke-width:1.5;stroke-dasharray:6 5}
  .pol{fill:#12261a;stroke:#3fb950;stroke-width:1.5}
  .cred{fill:#2a2110;stroke:#d29922;stroke-width:1.5}
  .aud{fill:#15233a;stroke:#4493f8;stroke-width:1.5}
  .line{stroke:#3d444d;stroke-width:2;fill:none}
</style>
<rect class="bg" width="920" height="470" rx="14"/>
<text class="h" x="40" y="46" text-anchor="start">Muse MCP Adapter</text>
<text class="s" x="40" y="68" text-anchor="start">Every call from Muse passes your policy. Your credentials stay inside.</text>
<rect class="box" x="40" y="170" width="150" height="130" rx="12"/>
<text class="t" x="115" y="226" text-anchor="middle">Muse</text>
<text class="s" x="115" y="246" text-anchor="middle"><tspan x="115" dy="0">your personal agent</tspan></text>
<rect class="zone" x="285" y="92" width="360" height="318" rx="16"/>
<text class="t" x="465" y="118" text-anchor="middle">Muse MCP Adapter</text>
<text class="s" x="465" y="136" text-anchor="middle">runs on a machine you own</text>
<rect class="pol" x="305" y="152" width="320" height="68" rx="10"><animate attributeName="stroke" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.1658;0.1667;0.2833;0.2842;0.6158;0.6167;0.7167;0.7175;1.0000" values="#3fb950;#3fb950;#ffffff;#ffffff;#3fb950;#3fb950;#ffffff;#ffffff;#3fb950;#3fb950"/></rect>
<text class="t" x="321" y="178" text-anchor="start">Your policy</text>
<text class="s" x="321" y="198" text-anchor="start">only what you approved is offered to Muse</text>
<rect class="cred" x="305" y="232" width="320" height="68" rx="10"/>
<text class="t" x="321" y="258" text-anchor="start">Your credentials</text>
<text class="s" x="321" y="278" text-anchor="start">never reach Muse</text>
<rect class="aud" x="305" y="312" width="320" height="76" rx="10"/>
<text class="t" x="321" y="338" text-anchor="start">Limits and audit</text>
<text class="s" x="321" y="358" text-anchor="start"><tspan x="321" dy="0">validation, size and time limits, a log of every call</tspan></text>
<rect class="box" x="745" y="112" width="140" height="70" rx="12"/>
<text class="t" x="815" y="152" text-anchor="middle">GitHub</text>
<rect class="box" x="745" y="212" width="140" height="70" rx="12"/>
<text class="t" x="815" y="252" text-anchor="middle">Linear</text>
<rect class="box" x="745" y="312" width="140" height="70" rx="12"/>
<text class="t" x="815" y="352" text-anchor="middle">Your own</text>
<text class="s" x="815" y="370" text-anchor="middle">MCP server</text>
<path class="line" d="M190 235 H285"/>
<text class="s" x="238" y="222" text-anchor="middle">REST over HTTPS</text>
<text class="s" x="238" y="256" text-anchor="middle">one token per</text>
<text class="s" x="238" y="272" text-anchor="middle">connector</text>
<path class="line" d="M645 235 C690 235 700 147 745 147"/>
<path class="line" d="M645 235 C690 235 700 247 745 247"/>
<path class="line" d="M645 235 C690 235 700 347 745 347"/>
<text class="s" x="700" y="106" text-anchor="middle">MCP</text>
<circle r="7" fill="#3fb950" opacity="0"><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0.0000;0.0000;1.0000;1.0000;1.0000" keyTimes="0.0000;0.0200;0.3000;0.3100;1.0000" path="M190 235 H285 H465 C560 235 700 147 745 147"/><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.0200;0.3000;0.3100;1.0000" values="0;1;1;0;0"/></circle>
<circle r="7" fill="#58a6ff" opacity="0"><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0.0000;0.0000;0.0000;1.0000;1.0000;1.0000" keyTimes="0.0000;0.3600;0.3700;0.6000;0.6100;1.0000" path="M745 147 C700 147 560 235 465 235 H190"/><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.3600;0.3700;0.6000;0.6100;1.0000" values="0;0;1;1;0;0"/></circle>
<circle r="5" fill="#d29922" opacity="0"><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0.0000;0.0000;0.0000;1.0000;1.0000;1.0000" keyTimes="0.0000;0.1200;0.1300;0.2800;0.2900;1.0000" path="M465 266 C560 266 700 170 745 160"/><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.1200;0.1300;0.2800;0.2900;1.0000" values="0;0;1;1;0;0"/></circle>
<circle r="7" fill="#f85149" opacity="0"><animateMotion dur="12.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0.0000;0.0000;0.0000;1.0000;1.0000;1.0000;1.0000" keyTimes="0.0000;0.6200;0.6300;0.7400;0.8000;0.8200;1.0000" path="M190 235 H285 H305"/><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.6200;0.6300;0.7400;0.8000;0.8200;1.0000" values="0;0;1;1;1;0;0"/></circle>
<g opacity="0"><text class="m" x="465" y="209" text-anchor="middle" style="fill:#f85149">not on your list: refused</text><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.74;0.76;0.88;0.90;1" values="0;0;1;1;0;0"/></g>
<circle cx="40" cy="442" r="6" fill="#3fb950"/><text class="s" x="54" y="446" text-anchor="start">a call you allowed</text>
<circle cx="220" cy="442" r="6" fill="#f85149"/><text class="s" x="234" y="446" text-anchor="start">a call you did not allow</text>
<circle cx="440" cy="442" r="5" fill="#d29922"/><text class="s" x="454" y="446" text-anchor="start">your credential, used only by the adapter</text>
</svg>
