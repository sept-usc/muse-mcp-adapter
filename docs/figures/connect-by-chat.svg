<g opacity="0"><path d="M380 240 H680" stroke="#58a6ff" stroke-width="2.2" fill="none"/><path d="M672 235 L680 240 L672 245" stroke="#58a6ff" stroke-width="2.2" fill="none"/><text class="l" x="530.0" y="214" text-anchor="middle"><tspan x="530.0" dy="0">propose_connection: the service and your</tspan><tspan x="530.0" dy="16">words, no guessed tool names</tspan></text><text class="s" x="368" y="244" text-anchor="end" style="font-size:11px">2</text><animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" keyTimes="0.0000;0.1308;0.1500;0.8846;0.9231;1.0000" values="0;0;1;1;0;0"/></g>
