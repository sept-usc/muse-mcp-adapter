<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730" role="img" aria-labelledby="t d">
<title id="t">Connect a server by chatting with Muse</title>
<desc id="d">Nine steps. The user asks Muse; Muse proposes without tool names; the adapter returns a review link; the user types the owner password and the service token on the review page; the adapter freezes what the service offers; Muse reads the details and drafts the smallest policy with reasons; the user approves with the owner password; the connector address and token are shown once; the user connects it in Muse.</desc>
<style>
  .bg{fill:#0d1117}
  .t{font:600 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
  .h{font:700 22px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
  .s{font:400 12.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9198a1}
  .l{font:500 12.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#c9d1d9}
  .m{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
  .box{fill:#151b23;stroke:#3d444d;stroke-width:1.5}
  .zone{fill:#10161f;stroke:#4493f8;stroke-width:1.5;stroke-dasharray:6 5}
  .pol{fill:#12261a;stroke:#3fb950;stroke-width:1.5}
  .cred{fill:#2a2110;stroke:#d29922;stroke-width:1.5}
  .aud{fill:#15233a;stroke:#4493f8;stroke-width:1.5}
  .line{stroke:#3d444d;stroke-width:2;fill:none}
</style>
<rect class="bg" width="1000" height="730" rx="14"/>
<text class="h" x="40" y="44" text-anchor="start">Connect a server by chatting with Muse</text>
<text class="s" x="40" y="66" text-anchor="start">Muse drafts the policy from the service's real details. You approve it with your owner password.</text>
<rect class="box" x="40" y="84" width="140" height="44" rx="10"/>
<text class="t" x="110" y="104" text-anchor="middle">You</text>
<text class="s" x="110" y="120" text-anchor="middle">on your own device</text>
<path d="M110 132 V706" stroke="#2a313c" stroke-width="2" stroke-dasharray="4 6"/>
<rect class="box" x="310" y="84" width="140" height="44" rx="10"/>
<text class="t" x="380" y="104" text-anchor="middle">Muse</text>
<text class="s" x="380" y="120" text-anchor="middle">the chat</text>
<path d="M380 132 V706" stroke="#2a313c" stroke-width="2" stroke-dasharray="4 6"/>
<rect class="box" x="610" y="84" width="140" height="44" rx="10"/>
<text class="t" x="680" y="104" text-anchor="middle">Adapter</text>
<text class="s" x="680" y="120" text-anchor="middle">and your review page</text>
<path d="M680 132 V706" stroke="#2a313c" stroke-width="2" stroke-dasharray="4 6"/>
<rect class="box" x="835" y="84" width="140" height="44" rx="10"/>
<text class="t" x="905" y="104" text-anchor="middle">GitHub</text>
<text class="s" x="905" y="120" text-anchor="middle">MCP server</text>
<path d="M905 132 V706" stroke="#2a313c" stroke-width="2" stroke-dasharray="4 6"/>
