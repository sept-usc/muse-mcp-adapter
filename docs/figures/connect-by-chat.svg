<g opacity="0"><path d="M680 432 H905" stroke="#58a6ff" stroke-width="2.2" fill="none"/><path d="M897 427 L905 432 L897 437" stroke="#58a6ff" stroke-width="2.2" fill="none"/><text class="l" x="792.5" y="406" text-anchor="middle"><tspan x="792.5" dy="0">look at what it offers, with</tspan><tspan x="792.5" dy="16">your token. Frozen as a snapshot</tspan></text><text class="s" x="668" y="436" text-anchor="end" style="font-size:11px">5</text><animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" keyTimes="0.0000;0.4077;0.4269;0.8846;0.9231;1.0000" values="0;0;1;1;0;0"/></g>
