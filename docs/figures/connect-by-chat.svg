<g opacity="0"><path d="M380 496 H680" stroke="#58a6ff" stroke-width="2.2" fill="none"/><path d="M672 491 L680 496 L672 501" stroke="#58a6ff" stroke-width="2.2" fill="none"/><text class="l" x="530.0" y="470" text-anchor="middle"><tspan x="530.0" dy="0">get_service_details, then revise_proposal</tspan><tspan x="530.0" dy="16">with a reason for each</tspan></text><text class="s" x="368" y="500" text-anchor="end" style="font-size:11px">6</text><animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" keyTimes="0.0000;0.5000;0.5192;0.8846;0.9231;1.0000" values="0;0;1;1;0;0"/></g>
