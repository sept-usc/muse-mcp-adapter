# Muse MCP Adapter deployment bundle. `muse-vm` writes the variables in .env for you.
#
# .env sets the images and the Tailscale settings. State lives
# in ./data, the adapter's configuration in ./config, and server tokens as files in ./secrets.
# Every image is pinned: the ones the adapter publishes by version, everything else by digest.
name: ${MMA_PROJECT:-muse-adapter}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }   # logs rotate, so they cannot fill the disk

x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging
  restart: unless-stopped

services:
  # Owns the network namespace of the adapter and installs the egress rules before it starts:
  # defence in depth behind the adapter's own refusal to call private or metadata addresses.
  guard:
    <<: *hardened
    image: ${MMA_GUARD_IMAGE}
    cap_add: [NET_ADMIN]
    read_only: true
    tmpfs: [/run]
    environment:
      MMA_EGRESS_ALLOW: ${MMA_EGRESS_ALLOW:-}
    networks:
      mma:
        aliases: [adapter]
    mem_limit: 64m
    pids_limit: 64

  adapter:
    <<: *hardened
    image: ${MMA_IMAGE}
    network_mode: service:guard
    depends_on:
      guard: { condition: service_healthy }
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777,noexec,nosuid"]
    environment:
      MUSE_ADAPTER_SECRETS_DIR: /run/secrets
      TZ: ${MMA_TZ:-UTC}
    volumes:
      - ./config:/config:ro
      - ./data:/data
      - ./secrets:/run/secrets:ro
      - ./backups:/backups
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256

  # ---- ingress: Tailscale Funnel publishes the adapter at https://<name>.<tailnet>.ts.net ----
  tailscale:
    # Pinned: Tailscale 1.102.x drops some Funnel connections (tailscale/tailscale#20739), and
    # the public address stops answering. 1.98.10 is reported good; MMA_TS_IMAGE picks another.
    image: ${MMA_TS_IMAGE:-tailscale/tailscale:v1.98.10@sha256:cdf5612ded5be1344f1a704b8c5e53496db97376bb533e5e15f141e48bf60cc0}
    hostname: ${MMA_TS_HOSTNAME:-muse-adapter}
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: unless-stopped
    depends_on:
      adapter: { condition: service_healthy }
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    networks: [mma]
    mem_limit: 256m
    pids_limit: 256

  # One-time sign-in, run by `muse-vm` before the stack starts (never part of it). Tailscale's own
  # container entrypoint gives up on an interactive login after a minute and restarts with a new
  # link, which is too short for a person. This waits as long as it takes, stores the login in the
  # same state directory, and exits; the `tailscale` service above then simply reconnects.
  tailscale-login:
    profiles: [login]
    image: ${MMA_TS_IMAGE:-tailscale/tailscale:v1.98.10@sha256:cdf5612ded5be1344f1a704b8c5e53496db97376bb533e5e15f141e48bf60cc0}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        sock=/tmp/login.sock
        tailscaled --state=/var/lib/tailscale/tailscaled.state --tun=userspace-networking --socket=$$sock &
        daemon=$$!
        waited=0
        while [ ! -S $$sock ] && [ $$waited -lt 30 ]; do sleep 1; waited=$$((waited + 1)); done
        tailscale --socket=$$sock up --hostname="$$TS_HOSTNAME" --accept-dns=false
        echo "Login complete."
        kill $$daemon || true
        wait $$daemon || true
    environment:
      TS_HOSTNAME: ${MMA_TS_HOSTNAME:-muse-adapter}
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    volumes:
      - ./ts-state:/var/lib/tailscale
    mem_limit: 256m
    pids_limit: 256

networks:
  mma: {}
