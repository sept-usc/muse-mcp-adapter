name: image
# Nothing is published from here: customers build the images from this repository on their own
# machines. This workflow proves the build works and scans what it produces.
on:
  pull_request:
    paths: [Dockerfile, requirements.lock, deploy/**, src/**, .github/workflows/image.yml]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # weekly: new advisories appear without any change to the code

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: adapter, context: . }
          - { name: guard, context: deploy/guard }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: mma-${{ matrix.name }}:ci
          build-args: REVISION=${{ github.sha }}
      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mma-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Software bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: mma-${{ matrix.name }}:ci
          artifact-name: sbom-${{ matrix.name }}.spdx.json
