name: image
on:
  pull_request:
    paths: [Dockerfile, requirements.lock, deploy/**, src/**]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: ${{ !startsWith(github.ref, 'refs/tags/') }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}:{1}', github.repository, github.ref_name) || 'mma-adapter:ci' }}
          sbom: true
          provenance: mode=max
      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}:{1}', github.repository, github.ref_name) || 'mma-adapter:ci' }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mma-guard deploy/guard
