[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muse-mcp-adapter"
dynamic = ["version"]
description = "Customer-owned gateway between Muse Custom Connectors and MCP servers"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "anyio",
  "cryptography",
  "httpx",
  "jsonschema",
  "mcp>=1.25,<2",
  "pydantic",
  "starlette",
  "uvicorn",
]

[project.scripts]
muse-mcp-adapter = "muse_mcp_adapter.cli:main"
muse-vm = "muse_vm.cli:main"

[project.optional-dependencies]
dev = [
  "httpx2",
  "openapi-spec-validator",
  "pyright",
  "pytest",
  "pytest-cov",
  "pyyaml",
  "ruff",
]

[tool.hatch.version]
path = "src/muse_vm/__init__.py"  # the one place the version is written

[tool.hatch.build.targets.wheel]
packages = ["src/muse_mcp_adapter", "src/muse_vm"]

# What the images are built from travels inside the wheel, so `pipx install` is enough: no clone.
[tool.hatch.build.targets.wheel.force-include]
"Dockerfile" = "muse_vm/context/Dockerfile"
"requirements.lock" = "muse_vm/context/requirements.lock"
"deploy/guard" = "muse_vm/context/guard"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/Dockerfile",
  "/requirements.lock",
  "/deploy/guard",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src", "examples"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -m 'not performance'"
markers = [
  "validation: product validation suite driven by the Atlas MCP server",
  "performance: timing measurements, skipped by default (run them with: pytest -m performance)",
]

[tool.coverage.run]
source = ["muse_mcp_adapter", "muse_vm"]
omit = ["*/__main__.py"]

# A floor, not a target: coverage may go up but not down. Raise it when it has risen.
[tool.coverage.report]
fail_under = 87
show_missing = false
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "examples"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
